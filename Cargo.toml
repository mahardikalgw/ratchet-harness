[workspace]
members = [
    "crates/ratchet-cli",
    "crates/ratchet-core",
    "crates/ratchet-spec",
    "crates/ratchet-providers",
    "crates/ratchet-tools",
    "crates/ratchet-mcp",
    "crates/ratchet-plugins",
    "crates/ratchet-a2a",
    "crates/ratchet-server",
    "crates/ratchet-acp",
    "crates/ratchet-sandbox",
    "crates/ratchet-memory",
    "crates/ratchet-observability",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
authors = ["Otongs <muhammadkharismam@gmail.com>"]
license = "MIT"
repository = "https://github.com/otongs/ratchet"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
dialoguer = "0.11"
indicatif = "0.17"

# HTTP / API clients
# Default features are off on purpose: the default `native-tls` backend links
# OpenSSL on Linux, which cannot be built into a static musl binary. rustls is
# pure Rust and bundles its own trust roots, so the binary stays self-contained.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
eventsource-stream = "0.2"
futures = "0.3"

# Markdown / text parsing
pulldown-cmark = "0.12"
regex = "1.10"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"

# Crypto / keyring
keyring = { version = "3.0", features = ["apple-native", "windows-native", "linux-native"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# YAML
serde_yaml = "0.9"

# Collections / utils
indexmap = { version = "2.5", features = ["serde"] }
rayon = "1.10"
once_cell = "1.20"

# Testing
mockall = "0.13"
tempfile = "3.13"

# Internal workspace deps (will be published together)
ratchet-core = { path = "crates/ratchet-core" }
ratchet-spec = { path = "crates/ratchet-spec" }
ratchet-providers = { path = "crates/ratchet-providers" }
ratchet-tools = { path = "crates/ratchet-tools" }
ratchet-mcp = { path = "crates/ratchet-mcp" }
ratchet-plugins = { path = "crates/ratchet-plugins" }
ratchet-a2a = { path = "crates/ratchet-a2a" }
ratchet-server = { path = "crates/ratchet-server" }
ratchet-acp = { path = "crates/ratchet-acp" }
ratchet-sandbox = { path = "crates/ratchet-sandbox" }
ratchet-memory = { path = "crates/ratchet-memory" }
ratchet-observability = { path = "crates/ratchet-observability" }
