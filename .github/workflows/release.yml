name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ratchet

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: The tag must match the workspace version
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          expected="${tag#v}"

          # Ask cargo rather than parsing TOML, and confirm every crate agrees
          # on one version. A crate that drifted would ship a lying --version.
          versions="$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkgs = json.load(sys.stdin)['packages']
          print(' '.join(sorted({p['version'] for p in pkgs})))
          ")"

          echo "tag        : $tag"
          echo "expected   : $expected"
          echo "cargo says : $versions"

          if [ "$(echo "$versions" | wc -w)" -ne 1 ]; then
            echo "::error::workspace crates disagree on a version: $versions"
            exit 1
          fi

          if [ "$expected" != "$versions" ]; then
            echo "::error::tag '$tag' does not match the workspace version '$versions'"
            echo "::error::Use scripts/release.sh, which keeps the two in step."
            exit 1
          fi

          echo "version verified: $versions"

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing must not prevent the others from being published.
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries (cross-compiled in a container) so the same
          # artifact runs on glibc and musl distros alike.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            build: native
          - target: aarch64-apple-darwin
            os: macos-latest
            build: native
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build: native

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.build == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.build == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }} -p ratchet-cli

      - name: Build (native)
        if: matrix.build == 'native'
        run: cargo build --release --locked --target ${{ matrix.target }} -p ratchet-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$dist/"
          cp README.md LICENSE "$dist/"
          tar -czf "$dist.tar.gz" "$dist"
          echo "ASSET=$dist.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "$env:BIN_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "$dist/"
          Copy-Item "README.md", "LICENSE" -Destination "$dist/"
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip"
          "ASSET=$dist.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: checksums and release
    needs: build
    # Publish whatever built successfully, even if one target failed.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fail if nothing was built
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          echo "packaged assets: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no release assets were produced"
            exit 1
          fi

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Include the install script
        run: cp install.sh dist/install.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
