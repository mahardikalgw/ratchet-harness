name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(error|warning)" clippy.txt | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Test
        shell: bash
        run: |
          set +e
          # --no-fail-fast so every failing suite is reported, not just the first.
          cargo test --all --no-fail-fast 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface each failure as an annotation, which is readable from the
            # public API even when the raw log is not.
            grep -E "^test .* FAILED|^---- .* stdout ----|^thread .* panicked" test-output.txt               | head -40 | while IFS= read -r line; do
                echo "::error::$line"
              done
            exit "$status"
          fi

      - name: Build (release)
        run: cargo build --release

      - name: Smoke test the binary
        shell: bash
        run: |
          ./target/release/ratchet --version
          ./target/release/ratchet --help

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all

  version:
    name: workspace version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Every crate must share one version
        run: |
          set -euo pipefail
          versions="$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkgs = json.load(sys.stdin)['packages']
          print(' '.join(sorted({p['version'] for p in pkgs})))
          ")"
          echo "workspace version: $versions"
          if [ "$(echo "$versions" | wc -w)" -ne 1 ]; then
            echo "::error::crates disagree on a version: $versions"
            exit 1
          fi

  musl:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/ratchet
          if ldd target/x86_64-unknown-linux-musl/release/ratchet 2>&1 | grep -q "not a dynamic executable"; then
            echo "statically linked"
          else
            echo "::warning::binary may not be fully static"
          fi
